    swagger-ui:
      path: /swagger-ui.html

#??mysql???
spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/emos?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 15682203160
    druid:
      initial-size: 8
      max-active: 16
      min-idle: 8
      max-wait: 60000
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
  mvc:
    pathmatch:
      matching-strategy: ANT_PATH_MATCHER
  #??redis???
  data:
    redis:
      database: 0
      host: localhost
      port: 6379
      jedis:
        pool:
          max-active: 1000
          max-idle: 16
          max-wait: -1ms
          min-idle: 8
    #  ??mongoDB???
    mongodb:
      host: localhost
      port: 27017
      database: emos
      username: admin
      password: abc123456
      authentication-database: admin
  # Quartz ????
  quartz:
    job-store-type: memory
    auto-startup: true
    overwrite-existing-jobs: true
    wait-for-jobs-to-complete-on-shutdown: true
    properties:
      org:
        quartz:
          scheduler:
            instanceName: EmosScheduler
            instanceId: AUTO
          threadPool:
            threadCount: 10
          jobStore:
            class: org.quartz.simpl.RAMJobStore

